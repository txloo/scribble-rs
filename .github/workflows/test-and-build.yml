name: Build

on: push

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Workaround to get tags, getting git describe to work.
          fetch-depth: 0

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.5

      - name: Run tests
        shell: bash
        run: |
          go test -v -race ./...
